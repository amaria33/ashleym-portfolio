<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete payment | Resume Optimizer</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/resume/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/resume/">
          <span class="brand-name">Resume Optimizer</span>
          <span class="brand-by">by BuiltByAshley</span>
        </a>
        <nav>
          <a href="/resume/#order" class="nav-cta">Back to order</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="shell" style="max-width: 560px; margin-inline: auto">
        <div class="section-head" style="text-align: center">
          <p class="eyebrow">Almost done</p>
          <h2 id="pay-title">Complete your payment</h2>
          <p class="section-lede" id="pay-lede" style="margin-inline: auto">
            Your order details were sent. Pay securely with Stripe below.
          </p>
        </div>

        <div class="stripe-pay" id="stripe-pay">
          <p class="order-summary-label">Total due now</p>
          <p class="order-summary-total"><strong id="pay-total">—</strong></p>
          <div id="stripe-buy-button-mount"></div>
          <p id="pay-fallback" class="fineprint" hidden></p>
        </div>
      </div>
    </main>

    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
    <script src="/resume/config.js"></script>
    <script>
      (function () {
        var config = window.RESUME_CONFIG || {};
        var params = new URLSearchParams(window.location.search);
        var tier = (params.get("tier") || "").toLowerCase();
        var prices = Object.assign(
          { starter: 39.5, career: 74.5, pro: 124.5 },
          config.prices || {}
        );
        var labels = { starter: "Starter", career: "Career", pro: "Pro" };
        var title = document.getElementById("pay-title");
        var lede = document.getElementById("pay-lede");
        var totalEl = document.getElementById("pay-total");
        var mount = document.getElementById("stripe-buy-button-mount");
        var fallback = document.getElementById("pay-fallback");

        function money(n) {
          return n % 1 === 0 ? "$" + n.toFixed(0) : "$" + n.toFixed(2);
        }

        if (!tier || !prices[tier]) {
          if (title) title.textContent = "Choose a package first";
          if (lede) lede.textContent = "Head back to the order form to pick Starter, Career, or Pro.";
          if (fallback) {
            fallback.hidden = false;
            fallback.innerHTML = '<a href="/resume/#order">Return to order form</a>';
          }
          return;
        }

        if (title) title.textContent = "Pay for " + labels[tier];
        if (lede) {
          lede.textContent =
            "Your " + labels[tier] + " order details were sent. Complete payment below.";
        }
        if (totalEl) totalEl.textContent = money(prices[tier]);

        var buttonId = (config.stripeBuyButtons || {})[tier] || "";
        var pk = config.stripePublishableKey || "";
        var paymentUrl = (config.stripeLinks || {})[tier] || "";

        if (buttonId && pk && mount) {
          var el = document.createElement("stripe-buy-button");
          el.setAttribute("buy-button-id", buttonId);
          el.setAttribute("publishable-key", pk);
          mount.appendChild(el);
          return;
        }

        if (paymentUrl) {
          window.location.href = paymentUrl;
          return;
        }

        if (fallback) {
          fallback.hidden = false;
          fallback.textContent =
            "Checkout isn’t available right now. Email " +
            (config.contactEmail || "hello@builtbyashley.com") +
            ".";
        }
      })();
    </script>
  </body>
</html>
